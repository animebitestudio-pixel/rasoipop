<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"></head><body>
<title>RasoiPop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#587A55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout concept: one friendly column on phones with a bottom tab bar; a left rail and wider grids on tablet/desktop.
   Sage carries structure, tangerine is the "pop" for actions and alerts, warm cream is the ground. */
:root{
  --f-head:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#FBF4E6; --surface:#FFFDF8; --surface2:#F5EBD6; --ink:#2C2B27; --muted:#6B675A; --line:#E8DDC6;
  --sage:#587A55; --sage-d:#3F5C3D; --sage-soft:#E2EBD9; --on-sage:#FFFFFF;
  --tang:#F58A1F; --tang-soft:#FFE6CA; --tang-ink:#8F4707; --on-tang:#2C2B27;
  --good:#456F42; --warn:#B85C00; --bad:#B8362B; --low:#7A5F00;
  --good-bg:#E2EBD9; --warn-bg:#FFE6CA; --bad-bg:#FADAD5; --low-bg:#F6EAB5;
  --shadow:0 6px 22px rgba(90,65,20,.10); --shadow-s:0 2px 8px rgba(90,65,20,.08);
  --l1:87%; --l2:75%; --scrim:rgba(40,30,10,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1C17; --surface:#242720; --surface2:#2E3228; --ink:#F2EEDF; --muted:#B2AF9C; --line:#3B4033;
  --sage:#93B98F; --sage-d:#B7D6B3; --sage-soft:#2E3B2C; --on-sage:#142012;
  --tang:#FF9D42; --tang-soft:#48301A; --tang-ink:#FFC48A; --on-tang:#1E1608;
  --good:#9CC498; --warn:#FFB066; --bad:#FF8F82; --low:#E8CB5B;
  --good-bg:#2E3B2C; --warn-bg:#48301A; --bad-bg:#4B2622; --low-bg:#433B15;
  --shadow:0 6px 22px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3);
  --l1:36%; --l2:27%; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1C17; --surface:#242720; --surface2:#2E3228; --ink:#F2EEDF; --muted:#B2AF9C; --line:#3B4033;
  --sage:#93B98F; --sage-d:#B7D6B3; --sage-soft:#2E3B2C; --on-sage:#142012;
  --tang:#FF9D42; --tang-soft:#48301A; --tang-ink:#FFC48A; --on-tang:#1E1608;
  --good:#9CC498; --warn:#FFB066; --bad:#FF8F82; --low:#E8CB5B;
  --good-bg:#2E3B2C; --warn-bg:#48301A; --bad-bg:#4B2622; --low-bg:#433B15;
  --shadow:0 6px 22px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3);
  --l1:36%; --l2:27%; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.75rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
p{margin:0}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px;border-radius:8px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.mut{color:var(--muted)}.sm{font-size:.85rem}.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:600;font-size:1.45rem;letter-spacing:-.01em}
.brand b{color:var(--tang);font-weight:600}
.hright{display:flex;align-items:center;gap:10px}
.offpill{background:var(--warn-bg);color:var(--tang-ink);font-weight:800;font-size:.78rem;padding:5px 10px;border-radius:99px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--sage);color:var(--on-sage);font-family:var(--f-head);font-size:1.15rem;display:grid;place-items:center}
.l-pot{fill:var(--sage)}.l-rim{fill:var(--sage-d)}.l-b{fill:var(--tang)}.l-s{stroke:var(--tang);fill:none}.l-h{fill:var(--bg);opacity:.75}

/* nav */
.main{padding-block:8px 112px;min-height:70vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 18px rgba(80,60,20,.07)}
.navin{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-top:6px;padding-bottom:6px}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:.72rem;font-weight:700;color:var(--muted);min-height:52px}
.nb.on{background:var(--sage-soft);color:var(--sage-d)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tang);color:var(--on-tang);font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){
  .nav{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding-top:84px;box-shadow:none}
  .navin{display:flex;flex-direction:column;padding:0 8px;gap:6px;max-width:none}
  .nb{font-size:.76rem;padding:10px 2px}
  body{padding-left:96px}.hdr .wrap{padding-left:24px}.main{padding-bottom:48px}
  .hdr{position:sticky}.brand{margin-left:-80px;padding-left:14px;position:relative;z-index:26}
}

/* sections, cards */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-s);border:1px solid var(--line)}
.pad{padding:14px}
.grid{display:grid;gap:12px}
.g-meals{grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr))}
.g-rec{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.g-two{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.g-qa{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrapr{flex-wrap:wrap}.grow{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,var(--sage-soft),var(--tang-soft));border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.hero .date{font-weight:800;color:var(--sage-d);font-size:.9rem}
.hero .tag{font-family:var(--f-head);color:var(--tang-ink);font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px;margin-top:8px}
.stat{background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:0;min-width:0}
.stat b{font-family:var(--f-head);font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;font-weight:700;color:var(--muted)}
.stat.alert b{color:var(--warn)}

/* tiles (recipe art) */
.tile{position:relative;aspect-ratio:4/3;width:100%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 20% 15%,hsl(var(--h) 70% calc(var(--l1) + 6%)) 0 18%,transparent 19%),
  radial-gradient(circle at 85% 90%,hsl(var(--h) 55% calc(var(--l2) - 6%)) 0 22%,transparent 23%),
  linear-gradient(135deg,hsl(var(--h) 62% var(--l1)),hsl(var(--h) 55% var(--l2)))}
.tile .e{font-size:3.2rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.sq{aspect-ratio:1;border-radius:14px;width:56px}.tile.sq .e{font-size:1.8rem}
.tile.wide{aspect-ratio:16/10;max-height:300px}.tile.wide .e{font-size:5rem}
.rc{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-s);border:1px solid var(--line);overflow:hidden}
.rc-main{display:block;width:100%;text-align:left}
.rc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.rc-b h3{font-size:1rem}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;box-shadow:var(--shadow-s)}
.heart.on{color:var(--tang)}.heart.on svg{fill:currentColor}

/* chips, buttons, fields */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.chips.wr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--sage);color:var(--on-sage);border-color:var(--sage)}
.chip.tg.on{background:var(--tang);color:var(--on-tang);border-color:var(--tang)}
.chip.sm{min-height:32px;padding:4px 10px;font-size:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:800;background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn.pri{background:var(--sage);color:var(--on-sage);border-color:var(--sage)}
.btn.tang{background:var(--tang);color:var(--on-tang);border-color:var(--tang)}
.btn.line{background:transparent;border-color:var(--sage);color:var(--sage-d)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.s{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface2);flex:none}
.ib.on{color:var(--tang)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lab{font-weight:800;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--tang);outline-offset:0;border-color:var(--tang)}
.search{position:relative}.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}.search input{padding-left:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:700}
.sw button{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw button[aria-checked=true]{background:var(--sage)}.sw button[aria-checked=true]::after{transform:translateX(22px)}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:14px;padding:3px}
.step button{width:38px;height:38px;border-radius:11px;background:var(--surface);display:grid;place-items:center;font-weight:800}
.step span{min-width:34px;text-align:center;font-weight:800}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:800;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.low{background:var(--low-bg);color:var(--low)}
.pill.n{background:var(--surface2);color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--sage);border-radius:4px}
.bar.tg i{background:var(--tang)}

/* meals */
.meal{display:flex;flex-direction:column;overflow:hidden}
.meal .tile{aspect-ratio:16/10}.meal .tile .e{font-size:2.4rem}
.meal .mb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.meal .sl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--sage-d)}
.meal h3{font-size:1rem}
.meal .ba{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.meal .ba .btn{flex:1;padding:0 8px}
.meal.none{border:2px dashed var(--line);box-shadow:none;background:transparent;justify-content:center;align-items:flex-start;padding:12px;gap:6px;min-height:170px}
.mrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.mrow .tile.sq{width:56px}
.mrow.mt{padding:8px 10px}

/* planner */
.day{padding:12px}.day.past{opacity:.6}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.slot{display:grid;grid-template-columns:62px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.slot .sl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--sage-d)}
.sl-main{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.sl-main .tile.sq{width:44px;border-radius:12px}.sl-main .tile.sq .e{font-size:1.4rem}
.sl-main b{display:block;font-size:.95rem;line-height:1.2}.sl-main small{color:var(--muted);font-weight:700}
.sl-add{grid-column:2/5;justify-self:start;display:flex;align-items:center;gap:6px;color:var(--tang-ink);font-weight:800;padding:8px 4px;min-height:44px}

/* pantry & shopping */
.pit{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:12px;align-items:center;padding:12px}
.pit .tile.sq{width:52px}
.pit h3{font-size:1rem}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:12px;padding:2px}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center}
.qty b{min-width:64px;text-align:center;font-size:.9rem}
.pa{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.stat-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:22;height:54px;padding:0 20px;border-radius:27px;background:var(--tang);color:var(--on-tang);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(245,138,31,.4)}
@media(min-width:900px){.fab{bottom:24px}}
.gh{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-family:var(--f-head);font-size:1.05rem;color:var(--sage-d)}
.sit{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 10px}
.sit.done .nm{text-decoration:line-through;color:var(--muted)}
.ck{width:30px;height:30px;border-radius:10px;border:2px solid var(--sage);display:grid;place-items:center;color:transparent;background:var(--surface);flex:none}
.ck.on{background:var(--sage);color:var(--on-sage)}
.sit input[type=number]{width:74px;min-height:38px;padding:4px 8px}
.empty{text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:22px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--f-head);font-size:1.15rem;color:var(--ink)}
.skeleton{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* modal & overlay */
.bd{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:700px){.bd{align-items:center}.sheet{border-radius:26px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.ov-in{max-width:820px;margin:0 auto}
.ov-top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;background:linear-gradient(var(--bg) 60%,transparent)}
.ov-hero{margin:0 -16px;border-radius:0 0 26px 26px;overflow:hidden}
.ing{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ing.done .t{text-decoration:line-through;color:var(--muted)}
.stp{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stp i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--sage-d);font-weight:800;display:grid;place-items:center}
.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.nutr div{background:var(--surface2);border-radius:14px;padding:8px 4px}.nutr b{display:block;font-family:var(--f-head);font-size:1.15rem}.nutr span{font-size:.72rem;font-weight:700;color:var(--muted)}
.cook{display:flex;flex-direction:column;min-height:100vh;gap:14px}
.cook-step{font-family:var(--f-head);font-size:clamp(1.5rem,5.2vw,2.3rem);line-height:1.25;font-weight:500}
.cook-nav{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 0 6px;background:linear-gradient(transparent,var(--bg) 35%)}
.cook-nav .btn{min-height:62px;font-size:1.1rem}
.tmr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tang-soft);border-radius:18px;padding:12px 14px;color:var(--tang-ink);font-weight:800}
.tmr .v{font-family:var(--f-head);font-size:2rem}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;max-width:calc(100vw - 32px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{background:var(--tang-soft);color:var(--tang-ink);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.good{background:var(--good-bg);color:var(--good)}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="hdr"><div class="wrap hrow">

/* ---- ingredient master ---- */
const M={};ING.split(';').forEach(s=>{const[n,g,f]=s.split(':');M[n]={g,f:f||''}});

const ALIAS={atta:'wheat flour','gram flour':'besan',dahi:'curd',yogurt:'curd',yoghurt:'curd',coriander:'coriander leaves',cilantro:'coriander leaves',dhania:'coriander leaves',jeera:'cumin seeds',cumin:'cumin seeds',haldi:'turmeric powder',turmeric:'turmeric powder','red chilli':'red chilli powder','chilli powder':'red chilli powder','green chili':'green chilli',chilli:'green chilli',chili:'green chilli',mustard:'mustard seeds',rai:'mustard seeds',sooji:'semolina',rava:'semolina',suji:'semolina',toor:'toor dal','arhar dal':'toor dal',chana:'chickpeas','kabuli chana':'chickpeas',rajma:'kidney beans',sabudana:'sago','cooking oil':'oil',lauki:'bottle gourd',dudhi:'bottle gourd',bhindi:'okra',baingan:'brinjal',eggplant:'brinjal',methi:'fenugreek leaves',palak:'spinach',matar:'green peas',peas:'green peas',gobi:'cauliflower',gur:'jaggery',elaichi:'cardamom',hing:'asafoetida','curry leaf':'curry leaves',mint:'mint leaves','coriander seeds':'coriander powder',tea:'tea leaves','chai patti':'tea leaves',badam:'almonds',kaju:'cashews',nariyal:'coconut',namak:'salt',cheeni:'sugar',paani:'water',chawal:'rice',ghi:'ghee',makhan:'butter',doodh:'milk',malai:'cream',nimbu:'lemon',adrak:'ginger',lehsun:'garlic',pyaz:'onion',tamatar:'tomato',aloo:'potato',gajar:'carrot','shimla mirch':'capsicum',shimla:'capsicum',moongfali:'peanuts',groundnut:'peanuts','pav bun':'pav'};
function norm(s){s=String(s||'').toLowerCase().trim().replace(/\s+/g,' ');if(M[s])return s;if(ALIAS[s])return ALIAS[s];let t=s.replace(/ies$/,'y');if(M[t])return t;t=s.replace(/es$/,'');if(M[t])return t;t=s.replace(/s$/,'');if(M[t])return t;return ALIAS[t]||s}

const UNITS=['kg','g','l','ml','pcs','packet','tsp','tbsp'];

function parseIng(line){const t=String(line).trim().split(/\s+/);if(!t[0])return null;let q;const a=t[0];if(/^\d+\/\d+$/.test(a)){const[x,y]=a.split('/');q=+x/+y}else q=parseFloat(a);if(!isFinite(q)||q<=0)return null;let u='pcs',rest=t.slice(1);if(rest[0]){const w=rest[0].toLowerCase();const uu=UALIAS[w]||w;if(UNITS.includes(uu)){u=uu;rest=rest.slice(1)}}const n=rest.join(' ').trim();if(!n)return null;return{q,u,n:n.toLowerCase()}}
function toBase(q,u,n){if(u==='kg')return[q*1000,'w'];if(u==='g'||u==='ml')return[q,'w'];if(u==='l')return[q*1000,'w'];if(u==='tsp'||u==='tbsp'){const g=grp(n);const per=g==='S'?3:(g==='O'||g==='D')?5:4;return[q*per*(u==='tbsp'?3:1),'w']}if(PCSW[n]&&u==='pcs')return[q*PCSW[n],'w'];return[q,'c']}

/* ---- recipes ---- */

const BASE=RAW.map(a=>{const[id,name,e,cuisine,cats,pt,ct,sv,diff,desc,ings,steps,nut]=a;return build({id,name,e,cuisine,cats:cats.split(''),pt,ct,sv,diff,desc,nut:nut.split('/').map(Number),
  ing:ings.split(';').map(parseIng).filter(Boolean),steps:steps.split('|').map(s=>{const m=s.match(/@(\d+)\s*$/);return m?{t:s.replace(/@\d+\s*$/,'').trim(),m:+m[1]}:{t:s.trim()}})})});

/* ---- pantry helpers ---- */
const factor=u=>({kg:1000,l:1000}[u]||1);

function pantryNames(){return new Set(S.pantry.filter(p=>+p.qty>0&&!expired(p)).map(p=>norm(p.name)))}
function haveAmt(n){const o={w:0,c:0};S.pantry.forEach(p=>{if(norm(p.name)!==n||expired(p))return;const[v,k]=pBase(p);o[k]+=v});return o}
const expiringItems=()=>S.pantry.filter(p=>p.exp&&daysUntil(p.exp)<=3&&daysUntil(p.exp)>=0&&+p.qty>0).sort((a,b)=>a.exp.localeCompare(b.exp));

/* ---- matching ---- */
function matchRecipe(r,have){const req=[...new Set(r.names)].filter(n=>!isStaple(n));const miss=req.filter(n=>!have.has(n));const pct=req.length?Math.round(100*(req.length-miss.length)/req.length):100;return{r,pct,miss,have:req.filter(n=>have.has(n)),req}}

/* ---- needs & shopping ---- */
function addNeed(need,r,sv){const f=sv/r.sv;r.ing.forEach(i=>{const n=norm(i.n);if(isStaple(n))return;const[v,k]=toBase(i.q*f,i.u,n);const o=need[n]||(need[n]={w:0,c:0});o[k]+=v})}

function buildShopping(){const t=iso(todayD());const need={};Object.entries(S.plan).forEach(([d,day])=>{if(d<t)return;Object.values(day).forEach(id=>{const r=getR(id);if(r)addNeed(need,r,S.profile.family)})});

/* ---- planner ---- */
function weekDays(off=0){const t=todayD();const m=addDays(t,-((t.getDay()+6)%7)+off*7);return[...Array(7)].map((_,i)=>addDays(m,i))}
const EXPENSIVE=['paneer','cashews','almonds','cream','raisins','cheese'];
function planCtx(){return{have:pantryNames(),soon:new Set(expiringItems().map(p=>norm(p.name)))}}
function pickFor(slot,date,opt,ctx,exclude){const P=S.profile;let cands=allRecipes().filter(r=>fitsSlot(r,slot)&&passes(r)&&r.id!==exclude);
  if(opt.quick){const q=cands.filter(r=>total(r)<=P.maxTime);if(q.length)cands=q}
  if(!cands.length)return null;
  const near=[];for(let k=-2;k<=2;k++){const day=S.plan[iso(addDays(new Date(date+'T00:00:00'),k))];if(day&&k!==0)Object.values(day).forEach(id=>near.push(id))}
  const sameDay=Object.values(S.plan[date]||{});
  let best=null,bs=-1e9;cands.forEach(r=>{let s=Math.random()*2.5;
    if(opt.favs!==false&&S.favs.includes(r.id))s+=3;
    if(opt.pantry!==false){s+=matchRecipe(r,ctx.have).pct/100*4;s+=Math.min(3,r.names.filter(n=>ctx.soon.has(n)).length)*1.5}
    if(near.includes(r.id))s-=8;if(sameDay.includes(r.id))s-=10;
    const used=opt.used?(opt.used[r.id]||0):0;s-=used*4;
    if(total(r)>P.maxTime)s-=3;
    if((P.cuisines||[]).includes(r.cuisine))s+=1.5;
    if((P.diet||[]).includes('hp')&&r.tags.includes('hp'))s+=1.5;if((P.diet||[]).includes('lo')&&r.tags.includes('lo'))s+=1.5;
    if(P.budget==='economy'&&r.names.some(n=>EXPENSIVE.includes(n)))s-=3;
    if(s>bs){bs=s;best=r}});return best?best.id:null}
function genPlan(opt){const days=weekDays(opt.off||0).map(iso);const t=iso(todayD());const ctx=planCtx();let miss=0;const used={};
  days.forEach(d=>{if(d<t)return;S.plan[d]=S.plan[d]||{};if(opt.replace)opt.slots.forEach(s=>delete S.plan[d][s])});
  days.forEach(d=>Object.values(S.plan[d]||{}).forEach(id=>used[id]=(used[id]||0)+1));
  days.forEach(d=>{if(d<t)return;opt.slots.forEach(s=>{if(S.plan[d][s])return;const id=pickFor(s,d,{...opt,used},ctx);if(id){S.plan[d][s]=id;used[id]=(used[id]||0)+1}else miss++})});
  save('plan');return miss}

function fmtIng(i,f,spice){let q=i.q*f;const n=norm(i.n);if(spice&&(n==='red chilli powder'||n==='green chilli'))q*=spice;let u=i.u;
  if(u==='g'&&q>=1000){q/=1000;u='kg'}if(u==='ml'&&q>=1000){q/=1000;u='l'}const qs=(u==='g'||u==='ml')?String(Math.round(q/(q>=50?5:1))*(q>=50?5:1)||Math.round(q)):fmtN(q);

const COMMON=['potato','onion','tomato','rice','curd','milk','paneer','wheat flour','besan','semolina','poha','moong dal','toor dal','spinach','cauliflower','green peas','carrot','capsicum','lemon','ginger','garlic','green chilli','coriander leaves','cumin seeds','mustard seeds','garam masala','ghee','butter','bread','sev'];
function cookSet(){if(!U.cookSel)U.cookSel=[...pantryNames()];return new Set(U.cookSel)}
function shopForNames(r,names){const need={};addNeed(need,{ing:r.ing.filter(i=>names.includes(norm(i.n))),sv:r.sv},S.profile.family);return Object.entries(need).flatMap(([n,o])=>['w','c'].filter(k=>o[k]>0).map(k=>toShopItem({n,k,q:o[k]})))}
function vCook(){const set=cookSet();const all=matchAll(set).filter(m=>m.req.some(n=>set.has(n)));
  const now=all.filter(m=>m.pct===100&&m.req.length),almost=all.filter(m=>m.pct<100&&m.miss.length<=2),explore=all.filter(m=>m.miss.length>=3&&m.pct>=40).slice(0,8);

  return`<div class="page-h"><div><h1>Cook with what I have</h1><p class="mut">Pick your ingredients and see what you can cook, best matches first.</p></div></div>

  ${U.cookPhoto?`<div class="stack"><img class="thumb" src="${U.cookPhoto}" alt="Your ingredients photo"><p class="sm mut">Automatic recognition needs an AI service that is not connected here, so tap the ingredients you can see in your photo.</p><div class="chips wr">${COMMON.filter(n=>!set.has(n)).map(n=>`<button class="chip sm" data-act="cTag" data-n="${n}">+ ${cap(n)}</button>`).join('')}</div></div>`:''}
  <div class="lab">${set.size} ingredient${set.size===1?'':'s'} selected</div>${set.size?`<div class="chips wr">${[...set].sort().map(n=>`<button class="chip on sm" data-act="cRm" data-n="${esc(n)}" aria-label="Remove ${esc(n)}">${esc(cap(n))} ${ic('x',12)}</button>`).join('')}</div>`:`<p class="mut sm">Nothing selected yet.</p>`}
  <p class="mut sm">Salt, water, oil, turmeric and chilli powder are treated as always available${S.profile.staples===false?' (turned off in settings)':''}. Your diet and allergy settings are applied.</p></div>
  ${sec('100% match · Cook it now','You have everything',now)}${sec('Almost there','Missing 1–2 ingredients',almost)}${sec('Explore','Missing 3 or more',explore)}`}
function cookRow(m){const r=m.r;return`<article class="card pad stack" style="gap:8px"><button class="row" style="text-align:left" data-act="open" data-id="${r.id}">${tile(r,'sq')}<span class="grow"><b>${esc(r.name)}</b><span class="mut sm" style="display:block">${m.pct}% match · ${total(r)} min</span></span></button><div class="bar"><i style="width:${m.pct}%"></i></div>
  <div class="sm"><b>Have:</b> ${m.have.map(cap).join(', ')||'—'}</div>${m.miss.length?`<div class="sm" style="color:var(--tang-ink)"><b>Missing:</b> ${m.miss.map(cap).join(', ')}</div><button class="btn s tang" data-act="cMissing" data-id="${r.id}">Add missing to shopping list</button>`:`<button class="btn s pri" data-act="open" data-id="${r.id}">Cook it now</button>`}</article>`}

cRm:el=>{U.cookSel=[...cookSet()].filter(x=>x!==el.dataset.n);render()},cTag:el=>{const s=cookSet();s.add(el.dataset.n);U.cookSel=[...s];render()},
cUse:()=>{U.cookSel=[...pantryNames()];render()},cClear:()=>{U.cookSel=[];U.cookPhoto=null;render()},
cMissing:el=>{const r=getR(el.dataset.id);const set=cookSet();const names=matchRecipe(r,set).miss;const L=shopForNames(r,names);L.forEach(i=>addShop(i,'recipe'));save('shop');toast(L.length+' item'+(L.length===1?'':'s')+' added to your shopping list');renderNav()},
ideas:el=>{U.cookSel=[el.dataset.n];go('cook')},
/* settings */
sw:el=>{const k=el.dataset.k;if(k==='autoPantry'){S.autoPantry=!S.autoPantry;save('autoPantry');render();return}
  if(k.startsWith('g:')){const g=k.slice(2);U.gen[g]=!U.gen[g];openGen();return}
  if(k==='staples')S.profile.staples=S.profile.staples===false;else S.profile[k]=!S.profile[k];save('profile');openSettings(true);render()},
fam:el=>{S.profile.family=Math.min(12,Math.max(1,S.profile.family+ +el.dataset.d));save('profile');openSettings(true);render()},
dtog:el=>{const a=S.profile.diet||[],k=el.dataset.id;S.profile.diet=a.includes(k)?a.filter(x=>x!==k):[...a,k];save('profile');openSettings(true)},
spice:el=>{S.profile.spice=el.dataset.id;save('profile');openSettings(true)},
cuis:el=>{const a=S.profile.cuisines||[],k=el.dataset.id;S.profile.cuisines=a.includes(k)?a.filter(x=>x!==k):[...a,k];save('profile');openSettings(true)},
allT:el=>{const a=S.profile.allergies||[],k=el.dataset.id;S.profile.allergies=a.includes(k)?a.filter(x=>x!==k):[...a,k];save('profile');openSettings(true)},
allAdd:()=>{const v=$('#allx').value.trim().toLowerCase();if(!v)return;const a=S.profile.allergies||[];if(!a.includes(v))S.profile.allergies=[...a,v];save('profile');openSettings(true)},
budget:el=>{S.profile.budget=el.dataset.id;save('profile');openSettings(true)},
backup:()=>{const j=JSON.stringify({v:1,...S});const ta=$('#restore');const done=()=>toast('Backup copied. Paste it somewhere safe.');try{navigator.clipboard.writeText(j).then(done).catch(()=>{ta.value=j;ta.select();toast('Copy the backup text from the box')})}catch(e){ta.value=j;ta.select();toast('Copy the backup text from the box')}},
restore:()=>{try{const d=JSON.parse($('#restore').value);if(!d||!d.profile||!Array.isArray(d.pantry))throw 0;['profile','pantry','plan','shop','favs','cols','mine','notes','photos','autoPantry'].forEach(k=>{if(k in d)S[k]=d[k]});save(...Object.keys(S));closeModal();toast('Backup restored');render()}catch(e){toast('That does not look like a RasoiPop backup')}},
reset:()=>arm('reset',()=>{seedPantry();S.plan={};S.shop=[];genPlan({slots:['B','L','S','D'],off:0});buildShopping();save('plan','shop');closeModal();toast('Sample pantry and plan restored');render()}),
obT:el=>{U.ob[el.dataset.id]=!U.ob[el.dataset.id];const n=$('#ob-name').value,f=$('#ob-fam').value;onboard();$('#ob-name').value=n;$('#ob-fam').value=f},
obS:el=>{U.ob.spice=el.dataset.id;const n=$('#ob-name').value,f=$('#ob-fam').value;onboard();$('#ob-name').value=n;$('#ob-fam').value=f},
obGo:()=>{const name=$('#ob-name').value.trim();if(!name){$('#ob-name').focus();return toast('Please tell us your name')}
  S.profile={name,family:+$('#ob-fam').value,diet:[],jain:U.ob.jain,nog:U.ob.nog,spice:U.ob.spice,allergies:[],cuisines:[],maxTime:45,budget:'balanced',staples:true};seedPantry();genPlan({slots:['B','L','S','D'],off:0});buildShopping();save('profile','plan','shop');closeModal();toast('Welcome, '+name+'! Your week is ready.');render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=acts[el.dataset.act];if(f)f(el,e)});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='rq'){U.filters.q=v;refreshRec()}else if(k==='pq'){U.pq=v;$('#pList').innerHTML=pantryList()}else if(k==='pickq'){U.pick.q=v;refreshPick()}});
document.addEventListener('change',async e=>{const t=e.target,k=t.dataset.ch;if(!k)return;
  try{
  if(k==='rcu'){U.filters.cuisine=t.value;render()}
  else if(k==='psort'){U.psort=t.value;render()}
  else if(k==='pname'){if(t.value.trim()){S.profile.name=t.value.trim();save('profile');render()}}
  else if(k==='pmax'){S.profile.maxTime=+t.value;save('profile')}
  else if(k==='note'){S.notes[t.dataset.id]=t.value;save('notes');toast('Note saved')}
  else if(k==='sqty'){const it=S.shop.find(x=>x.id===t.dataset.id);const q=parseFloat(t.value);if(q>0){it.qty=q;after('shop')}else render()}
  else if(k==='pfName'){const e2=$('#pf-e');const n=norm(t.value);if(e2&&!e2.value&&n){e2.value=iso(addDays(todayD(),SHELF[grp(n)]||90));if(!U.editing)$('#pf-loc').value=LOC[grp(n)]}}
  else if(t.files&&t.files[0]){const img=await readPhoto(t.files[0],k==='cphoto'?900:720);
    if(k==='rphoto'){S.photos[t.dataset.id]=img;U.keepScroll=true;after('photos')}
    else if(k==='rfPhoto'){U.rfPhoto=img;$('#rf-phn').textContent='Photo ready'}
    else if(k==='pfPhoto'){U.pfPhoto=img;$('#pf-phn').textContent='Photo ready'}
    else if(k==='cphoto'){U.cookPhoto=img;render()}
    if(!persistOK)toast('Storage is full or blocked. This photo may not be kept.')}
  }catch(err){toast('Could not read that file')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();acts[e.target.dataset.enter]()}
  if(e.key==='Escape'){if($('#modal').innerHTML&&S.profile)closeModal();else if(U.cook||U.recipe)acts.closeOv()}});
const setOnline=()=>{const off=navigator.onLine===false;$('#offPill').hidden=!off};
window.addEventListener('offline',()=>{setOnline();toast('You are offline. Everything still works.')});
window.addEventListener('online',()=>{setOnline();toast('Back online')});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(['home','recipes','planner','pantry','shopping','cook'].includes(r)&&r!==U.route){U.route=r;render()}});
if(!window.claude&&'serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* ---- boot ---- */
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
(function boot(){const h=location.hash.slice(1);if(['home','recipes','planner','pantry','shopping','cook'].includes(h))U.route=h;
  if(S.profile&&!S.pantry){seedPantry()}if(!S.pantry)S.pantry=[];setOnline();render()})();
})();
</script>
</body></html>
